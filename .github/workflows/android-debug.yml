name: Build BookFlow Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/firebase-bootstrap

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore Firebase configuration
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "Missing repository secret FIREBASE_GOOGLE_SERVICES_JSON_BASE64"
            exit 1
          fi
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          jq -e '.client[] | select(.client_info.android_client_info.package_name == "com.bookflow.reader")' app/google-services.json > /dev/null

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Stage named APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BookFlow-v0.1.0-alpha-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookFlow-v0.1.0-alpha-debug
          path: BookFlow-v0.1.0-alpha-debug.apk
          if-no-files-found: error

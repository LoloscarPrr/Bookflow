name: Build BookFlow APK

on:
  push:
    branches:
      - main
      - feature/ai-native-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Firebase Crashlytics when available
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          if [[ -n "${FIREBASE_GOOGLE_SERVICES_JSON_BASE64:-}" ]]; then
            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            echo "Firebase Crashlytics configuration enabled."
          else
            echo "Firebase configuration absent; building with crash reporting inactive."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache offline neural voice
        uses: actions/cache@v4
        with:
          path: .offline-tts-downloads
          key: bookflow-offline-tts-sherpa-1.13.6-sharvard-b30a7a83

      - name: Prepare offline neural voice
        run: bash scripts/fetch-offline-tts.sh

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BookFlow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build BookFlow APK

on:
  push:
    branches:
      - main
      - feature/ai-native-foundation
      - audit/phase-1-1-safe-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Firebase Crashlytics when available
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          if [[ -n "${FIREBASE_GOOGLE_SERVICES_JSON_BASE64:-}" ]]; then
            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            echo "Firebase Crashlytics configuration enabled."
          else
            echo "Firebase configuration absent; building with crash reporting inactive."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache offline neural voice
        uses: actions/cache@v4
        with:
          path: .offline-tts-downloads
          key: bookflow-offline-tts-sherpa-1.13.6-miro-15c7593c-daniela-71cbf6b7

      - name: Prepare offline neural voice
        run: bash scripts/fetch-offline-tts.sh

      - name: Restore persistent BookFlow signing key
        env:
          BOOKFLOW_SIGNING_PASSWORD: ${{ secrets.BOOKFLOW_SIGNING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${BOOKFLOW_SIGNING_PASSWORD:-}" ]]; then
            echo "::error::Configure BOOKFLOW_SIGNING_PASSWORD under repository Actions secrets."
            exit 1
          fi
          umask 077
          printf '%s\\n' "$BOOKFLOW_SIGNING_PASSWORD" |
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -a \\
              -in signing/bookflow-signing.jks.enc.b64 \\
              -out app/bookflow-signing.jks -pass stdin
          test -s app/bookflow-signing.jks
          keytool -list -keystore app/bookflow-signing.jks -storetype PKCS12 \\
            -alias bookflow -storepass:env BOOKFLOW_SIGNING_PASSWORD >/dev/null

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build persistently signed debug APK
        env:
          BOOKFLOW_SIGNING_PASSWORD: ${{ secrets.BOOKFLOW_SIGNING_PASSWORD }}
          BOOKFLOW_REQUIRE_PERSISTENT_SIGNING: "true"
        run: gradle :app:assembleDebug --stacktrace

      - name: Validate APK package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          BUILD_TOOLS="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$BUILD_TOOLS"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          PACKAGE="$("$BUILD_TOOLS/aapt" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          test "$PACKAGE" = "app.bookflow.reader"
          echo "Validated package: $PACKAGE"
          EXPECTED_CERT_SHA256="19541d2616517c7c7cc7e0e68f9175154eb33e0f61be55935ed4ff60a88ec1c4"
          ACTUAL_CERT_SHA256="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          ACTUAL_CERT_SHA256="$(printf '%s' "$ACTUAL_CERT_SHA256" | tr '[:upper:]' '[:lower:]')"
          if [[ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::APK is not signed with the canonical BookFlow certificate."
            exit 1
          fi
          echo "Verified canonical BookFlow signing certificate."
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BookFlow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
